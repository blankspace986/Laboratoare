<!DOCTYPE html>
<html>
<head>
<title>Alerte si fundalul paginii</title>
</head>
<body>

<h1>Ordinea de incarcare a paginii</h1>

<script>
window.alert("S-a incarcat titlul. Urmeaza primul paragraf.");
</script>

<p onclick="document.body.style.backgroundColor = 'yellow'">
Primul paragraf: dati clic aici si fundalul paginii devine galben.</p>

<script>
window.alert("S-a incarcat primul paragraf. Urmeaza al doilea.");
</script>

<p onclick="document.body.style.backgroundColor = 'orange'">
Al doilea paragraf: dati clic aici si fundalul paginii devine portocaliu.</p>

</body>
</html>
