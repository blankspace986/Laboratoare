<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Bec cu contor</title>
<script>
var contor = 0; // in afara functiei, ca sa isi pastreze valoarea intre clicuri

function comutaBec() {
  var bec = document.getElementById("bec");
  console.log(bec.src); // adresa completa, cu spatiul scris %20

  if (bec.src.indexOf("Bec%20stins") != -1) {
    bec.src = "Bec aprins.gif";
    contor = contor + 1;
    document.getElementById("mesaj").innerHTML = "Becul a fost aprins de " + contor + " ori.";
  } else {
    bec.src = "Bec stins.gif";
  }
}
</script>
</head>
<body>

<h1>Bec cu contor</h1>

<p>
<img id="bec" src="Bec stins.gif" width="100" height="180" onclick="comutaBec()">
</p>

<p id="mesaj">Becul a fost aprins de 0 ori.</p>

<p><a href="index.html">Înapoi la temă</a></p>

</body>
</html>
